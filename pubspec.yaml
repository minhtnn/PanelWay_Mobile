name: panelway_mobile
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.2.1
  dio: ^5.2.0
  provider: ^5.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  animated_notch_bottom_bar: ^1.0.3
  flutter_launcher_icons: ^0.14.3
  material_symbols_icons: ^4.2805.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
    - lib\assets\default-avatar.png

flutter_icons:
  android: true
  ios: true
  image_path: "lib\\assets\\panelway-black-icon.png"
