name: panelway_mobile
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+7

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.2.1
  dio: ^5.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  animated_notch_bottom_bar: ^1.0.3
  flutter_launcher_icons: ^0.14.3
  material_symbols_icons: ^4.2805.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  shared_preferences: ^2.5.2
  permission_handler: ^11.3.1
  dotted_border: ^2.1.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.2
  http: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib\assets\Icon.png
    - lib\assets\default-avatar.png
    - lib\assets\panelway-black-icon.png
    - lib\assets\panelway-white-icon.png
    - lib\assets\Image-not-found.png
flutter_icons:
  android: true
  ios: true
  image_path: "lib\\assets\\panelway-black-icon.png"
